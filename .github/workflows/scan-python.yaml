name: Run security scans for a Python project

on:
  workflow_call:
    inputs:
      packages:
        required: false
        type: string
        description: |
          Deprecated: wheel building has been removed. This input is accepted but ignored.
          It will be removed in a future version.
      uv-export:
        type: boolean
        default: true
        description: |
          Whether to export requirements files from uv. Defaults to true.
      requirements-find-args:
        required: false
        type: string
        default: ""
        description: |
          Deprecated: requirements files are now discovered via the recursive source scan.
          This input is accepted but ignored. It will be removed in a future version.
      uv-export-extra-args:
        required: false
        type: string
        default: "--all-extras"
        description: |
          List of additional arguments for uv export commands (for example to ignore certain extras).
          Use multiline string to provide several sets of arguments.
      uv-export-no-groups:
        required: false
        type: string
        description: |
          Dependency groups to exclude from uv export (e.g. docs-sphinx-stack). Each group on its
          own line. The group must exist in the project's dependency-groups table and must not be
          transitively included by any other active group (via include-group).
      osv-exclude-files:
        required: false
        type: string
        description: |
          Files to remove from the source checkout before the OSV source scan, relative to the
          repository root. Useful for excluding root-level lockfiles that belong to a different
          ecosystem or are already covered by a filtered export. Each filename on its own line.
      osv-exclude-paths:
        required: false
        type: string
        description: |
          Paths to exclude from the OSV source scan, passed as repeated --experimental-exclude
          flags. Useful for ignoring example projects or fixtures in docs/ or tests/ that contain
          their own lockfiles. Each path on its own line.

          See https://google.github.io/osv-scanner/usage/scan-source#excluding-paths for more
          information.
      osv-extra-args:
        required: false
        type: string
        default: ""
        description: |
          Additional arguments to pass to osv-scanner.
      trivy-extra-args:
        required: false
        type: string
        default: ""
        description: |
          Deprecated: Trivy has been removed. This input is accepted but ignored.
          It will be removed in a future version.

jobs:
  build-artefacts:
    name: Build artefacts
    permissions:
      contents: read
    runs-on: [ubuntu-latest]
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - name: Install tools
        shell: bash
        run: |
          retry() {
            local n=1
            local max=5
            local delay=2
            while ! "$@"; do
              if [[ $n -lt $max ]]; then
                n=$((n+1))
                echo "Command failed. Retrying in ${delay}s... (attempt ${n}/${max})"
                sleep $delay
                delay=$((delay*2))
              else
                echo "Command failed after ${max} attempts."
                return 1
              fi
            done
          }
          retry sudo snap install --classic astral-uv
          mkdir -p ${{ runner.temp }}/python-artefacts/requirements
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create requirements files from uv
        if: ${{ inputs.uv-export && hashFiles('uv.lock') != ''}}
        env:
          UV_EXPORT_NO_GROUPS: ${{ inputs.uv-export-no-groups }}
          UV_EXPORT_EXTRA_ARGS: ${{ inputs.uv-export-extra-args }}
        run: |
          no_group_args=""
          if [[ -n "${UV_EXPORT_NO_GROUPS}" ]]; then
            IFS=$'\n'
            for group in $(echo "${UV_EXPORT_NO_GROUPS}"); do
              no_group_args="${no_group_args} --no-group ${group}"
            done
            unset IFS
          fi
          IFS=$'\n'
          for extras in $(echo "${UV_EXPORT_EXTRA_ARGS}"); do
            unset IFS
            filename=uv-requirements.$(echo $extras | tr ' ' '_').txt
            uv export --frozen --no-editable --no-emit-workspace --format=requirements-txt $extras ${no_group_args} --output-file=${{ runner.temp }}/python-artefacts/requirements/$filename
          done
      - name: Upload artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artefacts
          path: ${{ runner.temp }}/python-artefacts
  scan-osv:
    name: OSV-scanner
    needs: build-artefacts
    permissions:
      contents: read
    runs-on: [ubuntu-latest]
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - name: Install tools
        run: |
          retry() {
            local n=1
            local max=5
            local delay=2
            while ! "$@"; do
              if [[ $n -lt $max ]]; then
                n=$((n+1))
                echo "Command failed. Retrying in ${delay}s... (attempt ${n}/${max})"
                sleep $delay
                delay=$((delay*2))
              else
                echo "Command failed after ${max} attempts."
                return 1
              fi
            done
          }
          retry sudo snap install osv-scanner
          retry sudo snap install --no-wait --classic astral-uv
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Download artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artefacts
          path: source
      - name: Scan requirements files
        if: ${{ !cancelled() && hashFiles('source/requirements/') != '' }}
        working-directory: source
        env:
          OSV_EXTRA_ARGS: ${{ inputs.osv-extra-args }}
        run: |
          for reqs in $(ls -1 requirements/*); do
            osv-scanner ${OSV_EXTRA_ARGS} --lockfile requirements.txt:${reqs}
          done
      - name: Remove files from source scan
        if: ${{ !cancelled() }}
        env:
          OSV_EXCLUDE_FILES: ${{ inputs.osv-exclude-files }}
          UV_EXPORT: ${{ inputs.uv-export }}
        run: |
          files_to_remove="${OSV_EXCLUDE_FILES}"
          # Implicitly ignore uv.lock if we exported, as it would be redundant to scan both
          # Additionally, if `uv-export-no-groups` is set, scanning the lockfile would raise
          # OSVs for groups the user tried to ignore anyways
          if [[ "${UV_EXPORT}" == "true" ]]; then
            files_to_remove="uv.lock
          ${files_to_remove}"
          fi
          IFS=$'\n'
          for file in ${files_to_remove}; do
            [[ -n "${file}" ]] && rm -f "source/${file}"
          done
          unset IFS
      - name: Scan source
        if: ${{ !cancelled() }}
        working-directory: source
        env:
          OSV_EXCLUDE_PATHS: ${{ inputs.osv-exclude-paths }}
          OSV_EXTRA_ARGS: ${{ inputs.osv-extra-args }}
        run: |
          exclude_args=""
          if [[ -n "${OSV_EXCLUDE_PATHS}" ]]; then
            IFS=$'\n'
            for path in $(echo "${OSV_EXCLUDE_PATHS}"); do
              exclude_args="${exclude_args} --experimental-exclude ${path}"
            done
            unset IFS
          fi
          osv-scanner scan --recursive --allow-no-lockfiles ${OSV_EXTRA_ARGS} ${exclude_args} .

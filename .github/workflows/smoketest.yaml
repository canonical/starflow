name: Smoke Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - closed

permissions:
  contents: read

# Serialize runs per PR: opened/synchronize/closed race on the same smoke branch.
concurrency:
  group: smoketest-${{ github.event.pull_request.number }}

env:
  GH_TOKEN: ${{ secrets.STARBASE_TOKEN }}
  STARBASE_REPO: canonical/starbase
  SMOKE_BRANCH: bot/smoketest/starflow-${{ github.event.pull_request.number }}
  # Fork PRs get no STARBASE_TOKEN, so steps only run for same-repo PRs.
  SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

# Single job so the check never shows as skipped, whatever the PR action.
jobs:
  smoke:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Clone starbase
        if: env.SAME_REPO == 'true' && github.event.action == 'opened'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical/starbase
          ref: main
          token: ${{ secrets.STARBASE_TOKEN }}
          persist-credentials: false

      - name: Point starflow refs at PR branch
        if: env.SAME_REPO == 'true' && github.event.action == 'opened'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Literal replace via python: the branch name is untrusted, so it must
          # never pass through sed or shell expansion.
          python3 - <<'EOF'
          import os
          import re
          import subprocess
          ref = os.environ["PR_HEAD_REF"]
          files = subprocess.run(
              ["grep", "-rl", "canonical/starflow/", ".", "--exclude-dir=.git"],
              capture_output=True, text=True,
          ).stdout.split()
          for path in files:
              with open(path, encoding="utf-8", errors="surrogateescape") as f:
                  text = f.read()
              if "\0" in text:
                  continue
              new = re.sub(
                  r"(canonical/starflow/[^\"'\s]*?)@main",
                  lambda m: m.group(1) + "@" + ref,
                  text,
              )
              if new != text:
                  with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                      f.write(new)
          EOF
          git checkout -B "$SMOKE_BRANCH"
          git add -A
          printf 'Point starflow refs at %s\n' "$PR_HEAD_REF" > /tmp/smoke-msg
          git commit -F /tmp/smoke-msg || true # retry-safe when nothing changed
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$STARBASE_REPO.git"
          git push --force -u origin "$SMOKE_BRANCH" # bot-owned disposable branch

      - name: Open starbase draft PR
        id: draft
        if: env.SAME_REPO == 'true' && github.event.action == 'opened'
        run: |
          existing=$(gh pr list --repo "$STARBASE_REPO" --head "$SMOKE_BRANCH" --json url --jq '.[0].url')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            url=$existing
          else
            url=$(gh pr create --repo "$STARBASE_REPO" --base main --head "$SMOKE_BRANCH" --draft \
              --title "Smoke test for starflow#$PR_NUMBER" \
              --body "Smoke test for https://github.com/canonical/starflow/pull/$PR_NUMBER")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment starflow PR
        if: env.SAME_REPO == 'true' && github.event.action == 'opened'
        env:
          DRAFT_URL: ${{ steps.draft.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo canonical/starflow --body "Smoke test: $DRAFT_URL"

      - name: Check smoke branch exists
        id: check
        if: env.SAME_REPO == 'true' && github.event.action == 'synchronize'
        run: |
          if gh api "repos/$STARBASE_REPO/branches/$SMOKE_BRANCH" --silent; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone smoke branch
        if: env.SAME_REPO == 'true' && github.event.action == 'synchronize' && steps.check.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical/starbase
          ref: bot/smoketest/starflow-${{ github.event.pull_request.number }}
          token: ${{ secrets.STARBASE_TOKEN }}
          persist-credentials: false

      - name: Push empty commit to re-run CI
        if: env.SAME_REPO == 'true' && github.event.action == 'synchronize' && steps.check.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Re-run CI for https://github.com/canonical/starflow/pull/$PR_NUMBER"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$STARBASE_REPO.git"
          git push origin HEAD

      - name: Close starbase smoke test PR
        if: env.SAME_REPO == 'true' && github.event.action == 'closed'
        run: |
          num=$(gh pr list --repo "$STARBASE_REPO" --head "$SMOKE_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            gh pr close "$num" --repo "$STARBASE_REPO" --comment "Closing: starflow PR was closed."
          fi

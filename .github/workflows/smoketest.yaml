name: Smoke Test

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.STARBASE_TOKEN }}
  STARBASE_REPO: canonical/starbase
  SMOKE_BRANCH: bot/smoketest/starflow-${{ github.event.pull_request.number }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Clone starbase
        uses: actions/checkout@v4
        with:
          repository: canonical/starbase
          ref: main
          token: ${{ secrets.STARBASE_TOKEN }}

      - name: Point starflow refs at PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          grep -rl 'canonical/starflow@' . --exclude-dir=.git | xargs sed -i "s|canonical/starflow@main|canonical/starflow@${{ github.event.pull_request.head.ref }}|g"
          git checkout -b "$SMOKE_BRANCH"
          git add -A
          git commit -m "Point starflow refs at ${{ github.event.pull_request.head.ref }}"
          git push -u origin "$SMOKE_BRANCH"

      - name: Open starbase draft PR
        id: draft
        run: |
          url=$(gh pr create --repo "$STARBASE_REPO" --base main --head "$SMOKE_BRANCH" --draft \
            --title "Smoke test for starflow#${{ github.event.pull_request.number }}" \
            --body "Smoke test for https://github.com/canonical/starflow/pull/${{ github.event.pull_request.number }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment starflow PR
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo canonical/starflow --body "Smoke test: ${{ steps.draft.outputs.url }}"

  rerun:
    runs-on: ubuntu-latest
    if: github.event.action == 'synchronize'
    steps:
      - name: Clone smoke branch
        uses: actions/checkout@v4
        with:
          repository: canonical/starbase
          ref: bot/smoketest/starflow-${{ github.event.pull_request.number }}
          token: ${{ secrets.STARBASE_TOKEN }}

      - name: Push empty commit to re-run CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Re-run CI for https://github.com/canonical/starflow/pull/${{ github.event.pull_request.number }}"
          git push origin HEAD

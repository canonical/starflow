name: CI summary self-test

on:
  # Doesn't execute untrusted PR code; worst case is a fork PR spending the
  # bot's Copilot seat and getting a bot comment, which is an accepted risk.
  workflow_run:
    workflows:
      - QA self-test
      - Check policy
    types:
      - completed

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  triage:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CI summary bot on itself
        uses: $/ci-summary
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          github-token: ${{ secrets.CRAFT_BOT_TOKEN }}

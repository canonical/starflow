name: Run security scans for a Go project

on:
  workflow_call:
    inputs:
      packages:
        required: false
        type: string
        description: |
          Deprecated: build tooling removed. This input is accepted but ignored.
          It will be removed in a future version.
      osv-extra-args:
        required: false
        type: string
        default: ""
        description: |
          Additional arguments to pass to osv-scanner.
      trivy-extra-args:
        required: false
        type: string
        default: ""
        description: |
          Deprecated: Trivy has been removed. This input is accepted but ignored.
          It will be removed in a future version.
      osv-exclude-files:
        required: false
        type: string
        description: |
          Files to remove from source checkout before OSV scan. Relative to repo root.
          Excludes root-level lockfiles from a different ecosystem or already scanned files.
          Each filename on its own line.
      osv-exclude-paths:
        required: false
        type: string
        description: |
          Paths to exclude from OSV source scan. Pass repeated --experimental-exclude flags.
          Use for example projects or fixtures in docs/ or tests/ that contain their own lockfiles.
          Each path on its own line.

          See https://google.github.io/osv-scanner/usage/scan-source#excluding-paths for more
          information.

jobs:
  scan-osv:
    name: OSV-scanner
    permissions:
      contents: read
    runs-on: [ubuntu-latest]
    steps:
      - name: Install tools
        run: |
          retry() {
            local n=1
            local max=5
            local delay=2
            while ! "$@"; do
              if [[ $n -lt $max ]]; then
                n=$((n+1))
                echo "Command failed. Retrying in ${delay}s... (attempt ${n}/${max})"
                sleep $delay
                delay=$((delay*2))
              else
                echo "Command failed after ${max} attempts."
                return 1
              fi
            done
          }
          retry sudo snap install osv-scanner
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Remove files from source scan
        if: ${{ !cancelled() }}
        env:
          OSV_EXCLUDE_FILES: "${{ inputs.osv-exclude-files }}"
        run: |
          IFS=$'\n'
          for file in ${OSV_EXCLUDE_FILES}; do
            [[ -n "${file}" ]] && rm -f "source/${file}"
          done
          unset IFS
      - name: Scan source
        if: ${{ !cancelled() }}
        working-directory: source
        env:
          OSV_EXCLUDE_PATHS: "${{ inputs.osv-exclude-paths }}"
          OSV_EXTRA_ARGS: "${{ inputs.osv-extra-args }}"
        run: |
          exclude_args=""
          if [[ -n "${OSV_EXCLUDE_PATHS}" ]]; then
            IFS=$'\n'
            for path in $(echo "${OSV_EXCLUDE_PATHS}"); do
              exclude_args="${exclude_args} --experimental-exclude ${path}"
            done
            unset IFS
          fi
          osv-scanner scan --recursive --allow-no-lockfiles ${OSV_EXTRA_ARGS} ${exclude_args} .

name: QA self-test
on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  lint-python:
    uses: ./.github/workflows/lint-python.yaml
  test-python:
    uses: ./.github/workflows/test-python.yaml
    secrets:
      secret-1: ${{ secrets.REPO_SECRET }}
    with:
      extra-env-vars: |
        REPO_VARIABLE=${{ vars.REPO_VARIABLE }}
        REPO_SECRET=$SECRET_1
  test-python-custom:
    uses: ./.github/workflows/test-python.yaml
    secrets:
      secret-1: ${{ secrets.REPO_SECRET }}
    with:
      # Test on many OS's to ensure that these workflows work everywhere.
      # Also ensure we can add a list of tags for self-hosted runners.
      fast-test-platforms: '[["jammy", "amd64"], ["noble", "arm64"], "ubuntu-22.04", "windows-latest", "macos-latest"]'
      fast-test-python-versions: '["3.14"]'
      slow-test-platforms: '["ubuntu-latest"]'
      slow-test-python-versions: '["3.14"]'
      lowest-python-version: "3.8"
      lowest-python-platform: '["focal", "amd64"]'
      use-lxd: true
      pytest-markers: smoketest and not steamtest
      setup-vars: SETUP_EXTRA=1
      extra-env-vars: |
        REPO_VARIABLE=${{ vars.REPO_VARIABLE }}
        REPO_SECRET=$SECRET_1
  test-python-as-root:
    uses: ./.github/workflows/test-python.yaml
    secrets:
      secret-1: ${{ secrets.REPO_SECRET }}
    with:
      # Test on many OS's to ensure that these workflows work everywhere.
      # Also ensure we can add a list of tags for self-hosted runners.
      # Intentionally overlaps with test-python-custom to verify that
      # coverage artifact names are unique across callers (the reusable
      # workflow includes the caller job identifier in the artifact name
      # to prevent 409 Conflict errors).
      fast-test-platforms: '["ubuntu-latest"]'
      fast-test-python-versions: '["3.14"]'
      slow-test-platforms: '["ubuntu-latest"]'
      slow-test-python-versions: '["3.14"]'
      lowest-python-version: "3.8"
      lowest-python-platform: "ubuntu-latest"
      test-command-prefix: sudo -E # Test that we can run with sudo.
      extra-env-vars: |
        REPO_VARIABLE=${{ vars.REPO_VARIABLE }}
        REPO_SECRET=$SECRET_1
  test-python-noop-platforms: # Test that the Python tests are all skipped when platforms are empty
    uses: ./.github/workflows/test-python.yaml
    with:
      fast-test-platforms: ""
      slow-test-platforms: ""
      lowest-python-platform: ""
  test-python-noop-versions: # Test that the Python tests are all skipped when versions are empty
    uses: ./.github/workflows/test-python.yaml
    with:
      fast-test-python-versions: ""
      slow-test-python-versions: ""
      lowest-python-version: ""
  test-python-no-lxd: # Regression test: use-lxd: false must actually skip setting up LXD
    uses: ./.github/workflows/test-python.yaml
    with:
      fast-test-platforms: '["jammy"]'
      fast-test-python-versions: '["3.14"]'
      slow-test-platforms: ""
      lowest-python-version: ""
      use-lxd: false
  verify-lxd-setup:
    name: Verify use-lxd input is honored
    if: ${{ !cancelled() }}
    needs: [test-python-custom, test-python-no-lxd]
    runs-on: ubuntu-latest
    steps:
      - name: Check Setup LXD step outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate --jq '.jobs[] | {name, steps}')

          # test-python-custom passes use-lxd: true, so at least one of its Linux
          # runners must have successfully run the "Setup LXD" step.
          lxd_true_success=$(echo "$jobs" | jq -s '[.[]
            | select(.name | startswith("test-python-custom"))
            | .steps[]? | select(.name == "Setup LXD" and .conclusion == "success")] | length')

          # test-python-no-lxd passes use-lxd: false, so "Setup LXD" must never
          # succeed (it should be skipped instead).
          lxd_false_success=$(echo "$jobs" | jq -s '[.[]
            | select(.name | startswith("test-python-no-lxd"))
            | .steps[]? | select(.name == "Setup LXD" and .conclusion == "success")] | length')

          echo "Setup LXD successes with use-lxd=true: ${lxd_true_success}"
          echo "Setup LXD successes with use-lxd=false: ${lxd_false_success}"

          exit_code=0
          if [ "${lxd_true_success}" -lt 1 ]; then
            echo "::error::Expected at least one successful 'Setup LXD' step when use-lxd is true"
            exit_code=1
          fi
          if [ "${lxd_false_success}" -ne 0 ]; then
            echo "::error::Expected no successful 'Setup LXD' steps when use-lxd is false"
            exit_code=1
          fi
          exit $exit_code
  verify-coverage-artifacts:
    name: Verify coverage artifacts
    if: ${{ !cancelled() }}
    needs: [test-python, test-python-custom, test-python-as-root]
    runs-on: ubuntu-latest
    steps:
      - name: Verify coverage artifacts are unique and present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[].name')
          coverage=$(echo "$artifacts" | grep '^coverage-' | sort)

          echo "=== Coverage artifacts ==="
          echo "$coverage"
          echo ""

          # Verify no duplicate artifact names
          dupes=$(echo "$coverage" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate coverage artifact names:"
            echo "$dupes"
            exit 1
          fi

          exit_code=0

          # Verify each caller job produced fast, slow, and lowest artifacts
          for job in test-python test-python-custom test-python-as-root; do
            for type in fast slow lowest; do
              if ! echo "$coverage" | grep -q "^coverage-${job}-${type}-"; then
                echo "::error::Missing coverage-${job}-${type}-* artifact"
                exit_code=1
              fi
            done
          done

          total=$(printf %s "$coverage" | grep -c .)
          echo "Total: ${total} unique coverage artifacts"
          exit $exit_code

name: Lint
on:
  workflow_call:
    inputs:
      source-files:
        description: "Whether the changes affect source files"
        type: string
        default: "true"
  # Because we have a uv.lock file, we can also use this workflow to lint ourselves.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Paths are filtered in their own job so the linting jobs can be skipped before a
  # runner is requested. Job conditions only see event data and needs.*.outputs, so
  # the paths filter cannot run inside the job that consumes its result.
  filter:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-slim
    outputs:
      source-files: ${{ steps.filter.outputs.source-files }}
      docs-files: ${{ steps.filter.outputs.docs-files }}
    steps:
      - name: Check out code
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        timeout-minutes: 1
        id: filter
        with:
          # Combine multiple negation checks into a union (¬A ∧ ¬B ∧ ¬C), because individual entries are checked independently (A ∨ B ∨ C).
          filters: |
            source-files:
              - '!({docs/**,*.md,**/*.md,.readthedocs.yaml})'
            docs-files:
              - '{docs/**,**/*.md,**/*.rst,.readthedocs.yaml}'

  files:
    needs: filter
    if: ${{ needs.filter.outputs.source-files == 'true' && inputs.source-files != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Begin snap installs of common linters
        timeout-minutes: 1
        id: snap-install
        run: |
          job1=$(sudo snap install --no-wait codespell ruff shellcheck)
          job2=$(sudo snap install --no-wait --classic tombi)
          job3=$(sudo snap install --no-wait --beta astral-ty)
          echo -n "jobs=$job1 $job2 $job3" >> $GITHUB_OUTPUT
      - name: Set up linters
        timeout-minutes: 3
        env:
          SNAP_JOBS: ${{ steps.snap-install.outputs.jobs }}
        run: |
          for job in ${SNAP_JOBS}; do
            sudo snap watch $job
          done

          sudo snap alias astral-ty.ty ty

          # Try setting up the linters, but if it breaks try again after an apt update.
          # It's written this way because mostly we don't need apt-get update and it just
          # makes the job take longer, but when we do need it it's because a package deb
          # got removed that makes the linter setup fail. This gets fixed automatically
          # when GitHub rebuilds the image.
          if ! make -j setup-lint; then
            sudo apt-get update
            make -j setup-lint
          fi
      - name: Run all linters
        run: make -k lint-code

  docs:
    needs: filter
    if: ${{ needs.filter.outputs.docs-files == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv with caching
        timeout-minutes: 3
        id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Set up documentation environment
        timeout-minutes: 3
        run: make setup-docs
      - name: Run documentation linters
        run: make -k docs-lint

  linkcheck:
    needs: filter
    if: ${{ needs.filter.outputs.docs-files == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv with caching
        timeout-minutes: 3
        id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Set up documentation environment
        timeout-minutes: 3
        run: make setup-docs
      - name: Check documentation links
        run: make -k docs-linkcheck

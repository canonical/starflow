name: Setup Python runner
description: Set up a GitHub runner for Starcraft Python workflows

inputs:
  use-lxd:
    type: boolean
    description: |
      Whether to set up LXD on Linux runners.
    default: true
  lxd-channel:
    type: string
    default: 5.21/candidate
    description: |
      LXD channel to install (e.g., 5.21/candidate)
  python-version:
    default: ""
    description: |
      Python version for uv setup (empty = default)

runs:
  using: composite
  steps:
    - name: Start apt update
      if: runner.os == 'Linux'
      id: apt
      shell: bash
      run: |
        nohup sudo apt-get update > /dev/null &
        echo "apt-pid=$!" >> "${GITHUB_OUTPUT}"
    - name: Setup LXD
      if: ${{ runner.os == 'Linux' && fromJSON(inputs.use-lxd) }}
      uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      with:
        channel: ${{ inputs.lxd-channel }}
    - name: Fetch source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Homebrew
      if: runner.os == 'macOS'
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7
      # Setup Homebrew on macOS for caching
    - name: Cache Homebrew Bundler RubyGems
      if: runner.os == 'macOS'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.set-up-homebrew.outputs.gems-path }}
        key: ${{ runner.os }}-rubygems-
          ${{ steps.set-up-homebrew.outputs.gems-hash }}
        restore-keys: ${{ runner.os }}-rubygems- # Restore keys
    - name: Install Homebrew Bundler RubyGems
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install-bundler-gems
    - name: Hash runner info
      id: runner-info
      shell: bash
      run: |
        cache-hash=$(printf '%s' "${{ toJSON(matrix['platform']) }}" |\
          sha1sum | cut -f1 -d' ')
        echo "cache-hash=${cache-hash}" >> "${GITHUB_OUTPUT}"
    - name: Set up uv with caching
      id: setup-uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      # v10.1.0
      with:
        enable-cache: true
        cache-suffix: ${{ steps.runner-info.outputs.cache-hash }}
        ignore-nothing-to-cache: true
        python-version: ${{ inputs.python-version }}
    - name: Complete apt update
      if: runner.os == 'Linux'
      shell: bash
      env:
        APT_PID: ${{ steps.apt.outputs.apt-pid }}
      run: |
        while [[ -d "/proc/${APT_PID:-dev/null}" ]]; do
          echo Still running...
          sleep 0.1
        done
